# Alembic CLI config. The database is whatever DATABASE_URL names (see
# backend/migrations/env.py); there is deliberately no URL in this file.
# The app applies pending migrations itself at startup, so the CLI is only
# needed to write a new migration or to step back:
#   alembic revision --autogenerate -m "add designs.foo"
#   alembic downgrade -1
[alembic]
script_location = backend/migrations
prepend_sys_path = .
