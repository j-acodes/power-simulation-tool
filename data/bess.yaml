# BESS supplier solutions.
#
# Each entry is a real supplier product, identified as its own datasheet
# identifies it: brand, series and model number. The catalogue key is a slug
# of brand and model. The display name (see BessSolution.display_name) leads
# with the series and qualifies it with the model number, because the series
# is how the product is recognised and the model number is what distinguishes
# two durations of the same series.
#
#   brand, series, model  : as printed on the datasheet
#   e_nominal_kwh          : nominal usable energy of ONE container [kWh]
#   pcs_s_kva / pcs_count  : apparent power of ONE PCS unit [kVA], and the
#                            number of PCS units per container
#   rated_active_power_kw  : rated active power Pn of ONE container at its AC
#                            terminals [kW] — the active-power limit in sizing,
#                            where pcs_s_kva x pcs_count stays the apparent
#                            limit (ADR-0008 amendment). Omitted when the
#                            supplier has not published it: such a solution
#                            cannot be sized or seeded until it is added.
#   pcs_lv_kv              : PCS AC output (line-to-line) voltage [kV] — the
#                            BESS station transformer paired with this
#                            solution must carry this same lv_kv (see
#                            data/bess_transformers.yaml)
#   duration_h             : discharge duration DECLARED by the model number,
#                            not derived from energy and power — see
#                            BessSolution's docstring
#   aux_p_kw / aux_q_kvar  : worst-case auxiliary draw (cooling, BMS, HVAC) of
#                            ONE station; null means the datasheet publishes no
#                            figure — the engine sums it as zero but raises an
#                            informational notice (see powertool.graph); 0.0
#                            means the datasheet states the draw as zero
#   datasheet_version / preliminary / datasheet_url : provenance of the
#                            transcription; datasheet_url may be empty when
#                            the source is not publicly linkable.
#   conversion_efficiency_pct / cell_rte_pct / aux_consumption : efficiency-run
#                            parameters (CONTEXT.md's "Efficiency run"), read
#                            only by powertool.efficiency, never by sizing;
#                            each carries its provenance in a comment.
#
# Container count per station is NOT declared here: it lives on the pairing
# between a solution and a station transformer, in data/bess_transformers.yaml
# (paired_solutions), because one solution is sold behind many station
# transformer ratings, each serving a different count.
#
# Everything below datasheet_url is TYPED: stored and displayed, never
# computed with (see CONTEXT.md's "Simulated parameter / typed parameter"
# entry). Where the datasheet states an inequality ("> 0.99", "< 1 %"), the
# bound is stored and the comparator lives in the view.
#
bess_solutions:
  sungrow-st6900ux-4h:
    brand: Sungrow
    series: PowerTitan 3.0
    model: ST6900UX-4H
    e_nominal_kwh: 6904.0
    pcs_s_kva: 450.0
    pcs_count: 4
    rated_active_power_kw: 1724.0  # Pn, Sungrow system curve
                                    # TI_20250915_ST6900UX-4H_System Curve_V1_EN,
                                    # Tab. 1-1 (1800 kVA apparent)
    pcs_lv_kv: 0.69
    duration_h: 4.0            # from the "4H" in the model number: 6904 kWh /
                                # (4 x 450 kVA) works out to 3.84 h, but the
                                # duration is declared, not derived (see
                                # BessSolution's docstring)
    aux_p_kw: null               # not published by this datasheet
    aux_q_kvar: null              # not published by this datasheet
    datasheet_version: Version 3
    preliminary: true
    datasheet_url: ""
    # Efficiency-run parameters (simulated; read only by powertool.efficiency).
    # One-way conversion efficiency DC terminals -> transformer station LV, as the product of
    # these items (98.45 %; Sungrow quotes 98.4 %). Source: Sungrow LV loss
    # parameters for PowerTitan 3.0, preliminary.
    conversion_efficiency_pct:
      dc_cable: 99.90
      pcs_bus: 99.95
      pcs: 98.70
      lv_cable: 99.90
    cell_rte_pct: 95.0           # PROJECT ASSUMPTION, not supplier data
    # Auxiliary consumption per container [kW], operating and standby, one
    # table per cycles-per-day reference. Source: Sungrow PowerTitan 3.0
    # technical proposal, Table 7 (1 cycle/day) and Table 8 (2 cycles/day),
    # preliminary. Interpolated linearly in ambient and in cycles per day
    # (ADR-0009).
    aux_consumption:
      - cycles_per_day: 1        # Table 7
        ambient_c:    [-30,   -10,   0,    15,    25,    35,    45,    50]
        operating_kw: [4.63,  5.32,  5.32, 11.15, 12.90, 17.70, 20.40, 19.90]
        standby_kw:   [12.30, 10.55, 5.10, 4.10,  4.10,  8.25,  10.00, 16.50]
      - cycles_per_day: 2        # Table 8
        ambient_c:    [-30,   -10,   0,    15,    25,    35,    45,    50]
        operating_kw: [4.63,  5.32,  5.32, 11.40, 12.90, 17.70, 21.00, 17.46]
        standby_kw:   [11.23, 10.60, 5.24, 5.00,  6.20,  9.60,  12.52, 17.60]
    # PCS derating, fraction of rated active power, charge and discharge alike:
    # 1.0 Pn up to 45 °C, linear to 0.6 Pn at 50 °C. Source: Sungrow
    # PowerTitan 3.0 technical proposal, Fig. 2-4, preliminary. Interpolated
    # linearly in ambient (ADR-0009).
    derating:
      ambient_c: [-30, 45,  50]
      fraction:  [1.0, 1.0, 0.6]
    # Typed specification, transcribed by hand from the datasheet.
    cell_type: LFP
    dc_v_min: 1101.6
    dc_v_max: 1489.2
    ac_v_min: 621.0
    ac_v_max: 759.0
    ac_i_a: 414.0                # per PCS unit
    pf_at_nominal: 0.99          # datasheet says "> 0.99"
    q_range_percent: 100.0       # datasheet says "-100 % ~ 100 %" (symmetric)
    f_nominal_hz: "50 / 60"      # string: the product supports both
    thdi_percent: 1.0            # datasheet says "< 1 %"
    isolation: Transformerless
    width_mm: 6058
    height_mm: 2896
    depth_mm: 2438
    weight_kg: 55000
    ip_rating: IP55
    corrosion_class: C4
    temp_min_c: -30.0
    temp_max_c: 45.0
    humidity_min_pct: 0.0
    humidity_max_pct: 100.0
    altitude_max_m: 4000.0
    cooling: Intelligent Liquid Cooling

  sungrow-st6680ux-2h:
    brand: Sungrow
    series: PowerTitan 3.0
    model: ST6680UX-2H
    e_nominal_kwh: 6684.0
    pcs_s_kva: 430.0
    pcs_count: 8                # NOTE: 8 PCS units, where the 4H sibling has 4
    pcs_lv_kv: 0.69
    duration_h: 2.0             # declared by the "2H" in the model number; 6684 kWh /
                                 # (8 x 430 kVA) works out to 1.94 h. Declared, not
                                 # derived (see BessSolution's docstring)
    aux_p_kw: null               # not published by this datasheet
    aux_q_kvar: null              # not published by this datasheet
    datasheet_version: Version 2
    preliminary: false           # this datasheet is NOT marked Preliminary, unlike the 4H
    datasheet_url: ""
    # This is the container that makes 0.5 C projects possible: 3440 kVA of
    # PCS (8 x 430 kVA) over 6684 kWh works out to 0.51 C, where the 4H
    # sibling's 1800 kVA over 6904 kWh is only 0.26 C.
    #
    # Typed specification, transcribed by hand from the datasheet.
    cell_type: LFP
    dc_v_min: 1101.6
    dc_v_max: 1489.2
    ac_v_min: 621.0
    ac_v_max: 759.0
    ac_i_a: 396.0                # per PCS unit
    pf_at_nominal: 0.99          # datasheet says "> 0.99"
    q_range_percent: 100.0       # datasheet says "-100 % ~ 100 %" (symmetric)
    f_nominal_hz: "50 / 60"      # string: the product supports both
    thdi_percent: 1.0            # datasheet says "< 1 %"
    isolation: Transformerless
    width_mm: 6058
    height_mm: 4223              # much taller than the 4H's 2896
    depth_mm: 2438
    weight_kg: 59100
    ip_rating: IP55
    corrosion_class: C4
    temp_min_c: -30.0
    temp_max_c: 45.0
    humidity_min_pct: 0.0
    humidity_max_pct: 100.0
    altitude_max_m: 4000.0
    cooling: Intelligent Liquid Cooling
