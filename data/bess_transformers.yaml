# BESS station transformers.
#
# A SEPARATE catalogue from data/transformers.yaml (the PV string-inverter
# stations), on purpose: a BESS station's LV rating must match its BESS
# solution's PCS voltage (see data/bess.yaml), which has no reason to equal
# the PV LV bus, so mixing the two catalogues would only invite mismatches.
#
# SUNGROW_MVS7400_LS below is a real datasheet entry (see data/datasheets).
# The GENERIC_* entries that follow it are still placeholder data — no other
# real BESS station transformer has been selected for this project yet.
# Their ratings follow placeholder assumptions matching the PV catalogue
# above (see transformers.yaml) pending real datasheets:
#   uk_percent = 8.0   (uniform placeholder)
#   p0_kw      = 0.1% of the rating
#   pk_kw      = 1.0% of the rating
#   i0_percent = 0.0
# lv_kv is chosen to match the PCS voltage of a paired BESS solution (see
# data/bess.yaml); hv_kv is left null (MV section voltage is a per-study
# choice).
#
# paired_solutions lists the BESS solutions (data/bess.yaml) this station
# transformer is actually sold with, each with the number of containers that
# station transformer serves. This is the pairing the sizing engine reads the
# container count from — see powertool.graph.supported_durations and
# powertool.database.load_bess_transformers. A station transformer with no
# paired_solutions (or omitting the key) is not sold with anything; a station
# naming it is rejected with unpaired_bess_solution.
#
bess_transformers:
  SUNGROW_MVS7400_LS:     # MVS7400-LS, real datasheet — DS_20250919_MVS7400-LS_Datasheet_V2_EN.pdf
    s_rated_kva_at_40c: 7400
    s_rated_kva_at_30c: null      # not published
    uk_percent: 7.0                # the ONLY datasheet-backed electrical figure on this entry
    pk_kw: 74.0                    # placeholder formula (1.0% of rating), same as the GENERIC_* entries below
    p0_kw: 7.4                     # placeholder formula (0.1% of rating)
    i0_percent: 0.0                # placeholder, same as the GENERIC_* entries below
    hv_kv: null
    lv_kv: 0.69
    brand: Sungrow
    model: MVS7400-LS
    vector_group: Dy11y11
    cooling: ONAN
    preliminary: true
    datasheet_version: V2
    datasheet_url: null   # no public URL known; local: DS_20250919_MVS7400-LS_Datasheet_V2_EN.pdf
    paired_solutions:
      # DELIBERATELY EMPTY — not "sold with nothing", but "nobody has told us
      # yet". A container count is read from a supplier, never computed: none of
      # the three PDFs in data/datasheets states one for this station, so there
      # is no honest number to put here. Arithmetic would give 4 (4 x 1800 kVA
      # PCS = 7200 kVA under 7400 kVA) — that is exactly the guess this file
      # must not launder into a figure an engineer would quote.
      #
      # Until a supplier confirms it, a station naming this transformer is
      # rejected with unpaired_bess_solution, which is the correct outcome: the
      # product is real and its datasheet is transcribed, but it cannot be
      # designed with. Add the count here and it becomes usable immediately.
    # Typed specification, transcribed verbatim from the datasheet.
    mv_kv_min: 11.0
    mv_kv_max: 36.0
    lv_winding_count: 2
    insulation_level: A
    f_nominal: "50 Hz / 60 Hz"
    uk_tolerance_pct: 10.0
    winding_material_mv: Aluminum
    winding_material_lv: Aluminum
    ip_rating_transformer: IP68
    ip_rating_enclosure: IP55
    rmu_kv_min: 24.0
    rmu_kv_max: 40.5
    rmu_rated_current_a: 630.0
    rmu_units: "DCV / CCV / CV / DV"
    rmu_relay_protection: "ANSI 50, 50N, 51, 51N"
    rmu_short_time_withstand: "20 kA / 3 s or 25 kA / 1 s"
    cabinet_protection: Fuse+Disconnector
    surge_protection: Type I+II
    ac_insulation_detection: Optional
    cabinet_temp_control: Air cooling and HVAC
    ups: "2 h (default); 15 min / 3 / 4 h (optional)"
    width_mm: 6058
    height_mm: 2896
    depth_mm: 2438
    weight_kg: 26500
    cable_entry: Bottom entry
    corrosion_class: C4
    temp_min_c: -30.0
    temp_max_c: 45.0
    humidity_min_pct: 0.0
    humidity_max_pct: 100.0
    altitude_max_m: 4000.0
    communication: "Ethernet, Optical fiber, RS485"
    standards: "IEC 62271-202, IEC 61439"

  GENERIC_BESS_TX_2750_LV069:   # sized for sungrow-st6900ux-4h, 1 container (1800 kVA PCS)
    s_rated_kva_at_40c: 2750
    uk_percent: 8.0
    pk_kw: 27.5
    p0_kw: 2.75
    i0_percent: 0.0
    hv_kv: null
    lv_kv: 0.69
    brand: Generic
    paired_solutions:
      sungrow-st6900ux-4h: 1

  GENERIC_BESS_TX_4000_LV069:   # sized for sungrow-st6900ux-4h, 2 containers (3600 kVA PCS)
    s_rated_kva_at_40c: 4000
    uk_percent: 8.0
    pk_kw: 40.0
    p0_kw: 4.0
    i0_percent: 0.0
    hv_kv: null
    lv_kv: 0.69
    brand: Generic
    paired_solutions:
      sungrow-st6900ux-4h: 2

  GENERIC_BESS_TX_1750_LV100:   # no paired solution — exercises bess_lv_mismatch
    s_rated_kva_at_40c: 1750
    uk_percent: 8.0
    pk_kw: 17.5
    p0_kw: 1.75
    i0_percent: 0.0
    hv_kv: null
    lv_kv: 1.0
    brand: Generic
